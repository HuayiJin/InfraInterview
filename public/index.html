<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TensorBench · AI Infra 面试官工作台 (LLM 训练 / 推理 / RL)</title>
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/layout.css" />
  <link rel="stylesheet" href="/styles/components.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Left Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <rect x="2.5" y="2.5" width="7.5" height="7.5" rx="1.8" stroke="currentColor" stroke-width="1.8" />
            <rect x="14" y="2.5" width="7.5" height="7.5" rx="1.8" stroke="#38bdf8" stroke-width="1.8" />
            <rect x="2.5" y="14" width="7.5" height="7.5" rx="1.8" stroke="#34d399" stroke-width="1.8" />
            <rect x="14" y="14" width="7.5" height="7.5" rx="1.8" stroke="#fbbf24" stroke-width="1.8" />
            <path d="M10 6.25H14M6.25 10V14M17.75 10V14M10 17.75H14" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.4" />
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-name">TensorBench</div>
          <div class="brand-sub">AI INFRA INTERVIEWER</div>
        </div>
      </div>

      <nav class="nav-list" aria-label="主导航">
        <button class="nav-item active" data-route="workspace" id="nav-workspace">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M14 3v18"/><path d="M7 8h4M7 12h4M7 16h2"/></svg>
          </span>
          <span class="nav-label" id="nav-workspace-label">面试工作台</span>
          <span class="nav-pill" id="nav-session-pill" hidden>进行中</span>
        </button>

        <button class="nav-item" data-route="bank" id="nav-bank">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          </span>
          <span class="nav-label">题库 &amp; 组卷</span>
          <span class="nav-count" id="nav-bank-count">28</span>
        </button>

        <button class="nav-item" data-route="dossier" id="nav-dossier">
          <span class="nav-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          </span>
          <span class="nav-label" id="nav-dossier-label">面评 &amp; 归档</span>
        </button>
      </nav>

      <div class="sidebar-divider"></div>

      <div class="sidebar-tracks">
        <div class="sidebar-section-title">全栈题库覆盖</div>
        <div class="track-mini-list" id="sidebar-track-stats"></div>
      </div>

      <div class="sidebar-footer">
        <button class="sidebar-engine-btn" id="open-settings-btn" title="配置 AI 引擎与 LLM API Key">
          <span class="status-dot" id="engine-status-dot"></span>
          <div class="engine-meta">
            <span class="engine-title" id="engine-mode-label">本地专家引擎</span>
            <span class="engine-sub" id="engine-sub-label">零配置 · 可接入 LLM API</span>
          </div>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </aside>

    <!-- Main Area -->
    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn mobile-only" id="mobile-menu-btn" aria-label="展开菜单">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div class="topbar-heading">
            <h1 id="page-title">面试官工作台</h1>
            <span class="topbar-subtitle" id="page-subtitle">Online Txt 交互板 · AI 实时追问与 Rubric 评分</span>
          </div>
        </div>

        <div class="topbar-right">
          <!-- Primary Role Switcher -->
          <div class="role-switcher" role="tablist" aria-label="切换视角">
            <button class="role-btn active" data-role="interviewer" id="role-interviewer" role="tab" aria-selected="true">
              面试官视角
            </button>
            <button class="role-btn" data-role="candidate" id="role-candidate" role="tab" aria-selected="false">
              候选人模拟
            </button>
          </div>

          <div class="session-clock" id="topbar-clock" title="点击开始/暂停面试计时">
            <span class="clock-dot paused" id="topbar-clock-dot"></span>
            <span class="mono" id="topbar-clock-time">00:00</span>
          </div>

          <button class="btn btn-ghost btn-sm" id="topbar-ai-btn" title="配置 AI 引擎 (DeepSeek / OpenAI / Qwen / Ollama)">
            <span class="status-dot mini" id="topbar-engine-dot"></span>
            <span id="topbar-engine-text">AI 配置</span>
          </button>

          <button class="icon-btn" id="theme-toggle-btn" title="切换深浅色主题" aria-label="切换深浅色主题">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" id="theme-icon">
              <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
          </button>
        </div>
      </header>

      <main class="main-content" id="main-content"></main>
    </div>

    <!-- Modal -->
    <div class="modal-backdrop" id="modal-backdrop" hidden>
      <div class="modal-dialog" id="modal-dialog" role="dialog" aria-modal="true"></div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container" aria-live="polite"></div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
